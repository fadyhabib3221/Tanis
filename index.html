<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      /* بتمنع Safari/Chrome على الموبايل من الزووم التلقائي لما أي input
         (زي حقل اليوزرنيم اللي عليه autoFocus في صفحة اللوجين) ياخد فوكس
         وخطه أصغر من 16px. الخاصية دي بتتفعّل بس على شاشات الموبايل عشان
         ما تأثرش على شكل الحقول على الديسكتوب. */
      @media screen and (max-width: 768px) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }
    </style>
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Flight Ticket Manager — manage tickets, employees and sales in one place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Flight Ticket Manager</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
